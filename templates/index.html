<!DOCTYPE html>
<html>
<head>
    <title>Standings</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        /* Menu Styles */
        .menu {
            background-color: #333;
            overflow: hidden;
        }
        .menu a {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }

        .menu a:hover {
            background-color: #ddd;
            color: black;
        }
    </style>
</head>
<body>
    <div class="menu">
        <a href="/">Home</a> <!-- Link back to the main page -->
        <a href="/schedule">Week Schedule</a>
    </div>
    <h1>Current Standings</h1>
    {{ table | safe }}
</body>
</html>
